version: 2
updates:
  # npm: weekly bumps, groups minor+patch into one PR, majors individual
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Type definitions follow the runtime, not the newest release:
      # @types/node the oldest Node in `engines` (>=20.10, tested on Node 20
      # in CI), @types/express the Express major Signal K server runs (4).
      # Change these by hand when those move.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/express'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  # GitHub Actions: weekly, one grouped PR for everything
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies
